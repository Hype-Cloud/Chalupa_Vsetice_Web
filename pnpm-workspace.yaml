# Build scripts allowed during install (pnpm 11 blocks unapproved ones).
# esbuild/workerd install native binaries used by Vite and Wrangler.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  unrs-resolver: false

# Moved from package.json "overrides" (pnpm 11 reads overrides here).
overrides:
  miniflare>sharp: 0.35.4
